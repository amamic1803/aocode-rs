[package]
name = "aocode"
description = "Advent of Code solutions in Rust"
version = "0.1.0"
edition = "2024"
authors = ["Antonio Mamić <antoniomamic007@gmail.com>"]
include = [
    "src/",
    "Cargo.toml",
    "LICENSE.md",
    "README.md",
]

[dependencies]
advent-of-code-ocr = "0.1.1"
clap = { version = "4.6.7", features = ["cargo"] }
itertools = "0.15.0"
md-5 = "0.11.0"
ndlife = "0.1.0"
pmath = "0.3.1"
regex = "1.13.1"
serde_json = "1.0.151"
smallvec = "1.16.2"

[target.wasm32-unknown-unknown.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Performance", "Window"] }

[lib]
name = "aocode"
path = "src/lib.rs"

[[bin]]
name = "aocode"
path = "src/main.rs"
