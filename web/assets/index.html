<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>aocode</title>
    <link rel="icon" href="images/snowflake.svg"/>
    <link rel="stylesheet" href="styles/site.css"/>
    <script src="scripts/site.js" defer type="module"></script>
  </head>
  <body>
    <header>
      <img alt="Christmas tree icon" src="images/christmas-tree.svg">
      <div>
        <h1>aocode</h1>
        <h2>A solver for problems from <a href="https://adventofcode.com" target="_blank" rel="noopener noreferrer">Advent of Code</a></h2>
      </div>
      <img alt="Santa Claus icon" src="images/santa-claus.svg">
    </header>
    <section>
      <div class="picker">
        <div class="selector">Year</div>
        <div class="selector">Day</div>
        <div class="selector">Part</div>
      </div>
    </section>
    <footer>
      <a href="https://github.com/amamic1803/aocode-rs"><img alt="GitHub Repository Static Badge" src="https://img.shields.io/badge/GitHub-aocode-blue?logo=github"></a>
      <a href="https://crates.io/crates/aocode"><img alt="Crates.io Version" src="https://img.shields.io/crates/v/aocode?logo=rust"></a>
      <a href="https://docs.rs/aocode"><img alt="docs.rs" src="https://img.shields.io/docsrs/aocode?logo=docs.rs&label=docs.rs"></a>
      <a href="https://github.com/amamic1803/aocode-rs/actions/workflows/test.yml"><img alt="GitHub Actions Workflow Status" src="https://img.shields.io/github/actions/workflow/status/amamic1803/aocode-rs/test.yml"></a>
      <a href="https://github.com/amamic1803/aocode-rs/blob/main/LICENSE"><img alt="GitHub License" src="https://img.shields.io/github/license/amamic1803/aocode-rs"></a>
    </footer>
    <div id="snow-container"></div>
  </body>
</html>
